name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: powershell
        run: ./scripts/test.ps1
      - name: Package portable app
        shell: powershell
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Leaf-windows
          path: |
            dist/Leaf-v*-windows.zip
            dist/Leaf-v*-windows.zip.sha256
          if-no-files-found: error
